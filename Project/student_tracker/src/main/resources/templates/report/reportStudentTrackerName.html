<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="fragments/head :: headerFragment"></head><body>
<nav th:replace="fragments/navHeader :: navbar"></nav><main class="page-shell"><header class="page-header"><div><span class="eyebrow">Progress insights</span><h1>Student study report</h1><p>Find every session logged for a student and review their activity.</p></div></header>
<section class="panel"><div class="panel-heading"><h2>Generate a report</h2></div><form class="search-bar" th:action="@{/studenttracker/report}" method="post"><div class="field"><label for="student-report-name">Student name</label><input id="student-report-name" type="text" name="studentName" th:value="${studentName}" placeholder="Enter student name" required></div><button class="button button-primary" type="submit">Generate report</button></form></section>
<div th:if="${message != null}" class="alert alert-info" th:text="${message}"></div>
<section class="panel" th:if="${records != null and !#lists.isEmpty(records)}"><div class="panel-heading"><div><h2>Report results</h2><span class="subtle" th:text="'Study sessions for ' + ${studentName}"></span></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Student</th><th>Subject</th><th>Date</th><th>Duration</th><th>Method</th><th>Daily goal</th><th>Weekly goal</th><th>Success</th><th>Notes</th><th>Created</th></tr></thead><tbody><tr th:each="item : ${records}"><td th:text="${item.id}"></td><td><strong th:text="${item.studentName}"></strong></td><td th:text="${item.subject}"></td><td th:text="${item.studyDate}"></td><td th:text="${item.studyDurationMinutes} + ' min'"></td><td th:text="${item.studyMethod}"></td><td th:text="${item.dailyStudyGoal} + ' min'"></td><td th:text="${item.weeklyStudyGoal} + ' min'"></td><td><span class="badge badge-success" th:text="${#numbers.formatDecimal(item.successRate,0,2)} + '%'"></span></td><td th:text="${item.notes}"></td><td th:text="${item.createdDateTime}"></td></tr></tbody></table></div></section>
</main><footer th:replace="fragments/footer :: footer"></footer></body></html>
