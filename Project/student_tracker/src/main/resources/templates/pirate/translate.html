<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="fragments/head :: headerFragment"></head><body><nav th:replace="fragments/navHeader :: navbar"></nav><main class="page-shell narrow"><header class="page-header"><div><span class="eyebrow">Other tools</span><h1>Pirate translator</h1><p>Translate an English phrase using the existing external API integration.</p></div></header><form class="panel" th:action="@{/pirate/submit}" method="post"><div class="field"><label for="english">English phrase</label><input id="english" type="text" th:field="${translate.english}" placeholder="Enter something to translate" required></div><div class="form-actions"><button class="button button-primary" type="submit">Translate phrase</button></div><div class="alert alert-info" th:if="${translate.pirate != null and !#strings.isEmpty(translate.pirate)}" th:text="${translate.pirate}"></div></form></main><footer th:replace="fragments/footer :: footer"></footer></body></html>
