<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Study Records</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<h1>Student Tracker</h1>

<div class="container page-card">
    <h2>📚 Student Study Records</h2>

<form th:action="@{/studenttracker}" method="get">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by student name">
    <button type="submit">Search</button>
</form>

<hr/>

<table border="1" cellspacing="0" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Student Name</th>
        <th>Subject</th>
        <th>Date</th>
        <th>Duration (mins)</th>
        <th>Method</th>
        <th>Daily Goal</th>
        <th>Weekly Goal</th>
        <th>Success Rate</th>
        <th>Notes</th>
        <th>Created Date/Time</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="record : ${records}">
        <td th:text="${record.id}"></td>
        <td th:text="${record.studentName}"></td>
        <td th:text="${record.subject}"></td>
        <td th:text="${record.studyDate}"></td>
        <td th:text="${record.studyDurationMinutes}"></td>
        <td th:text="${record.studyMethod}"></td>
        <td th:text="${record.dailyStudyGoal}"></td>
        <td th:text="${record.weeklyStudyGoal}"></td>
        <td th:text="${#numbers.formatDecimal(record.successRate,1,1)} + '%'"
            th:classappend="${record.successRate >= 80 ? 'badge-success'
                     : (record.successRate >= 50 ? 'badge-warning'
                     : 'badge-danger')}">
        </td>
        <td th:text="${record.notes}"></td>
        <td th:text="${record.createdDateTime}"></td>
        <td>
            <a th:href="@{/studenttracker/edit/{id}(id=${record.id})}">Edit</a>
            <a th:href="@{'/studenttracker/delete/' + ${record.id}}"
               onclick="return confirm('Are you sure?')">
                Delete
            </a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(records)}">
        <td colspan="11" class="text-center text-muted py-4">
            No study records found.
        </td>
    </tr>
    </tbody>

</table>

    <a class="btn-add" th:href="@{/studenttracker/add}" href="/studenttracker/add">
        ➕Add New Record
    </a>
</div>

</body>
</html>
