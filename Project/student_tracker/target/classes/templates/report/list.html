<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title id="pageTitle" th:text="${session.title}">Reports</title>
    <style>
        table {
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px 16px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        a {
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container has-text-centered">
    <h2 class="title is-2" style="margin-bottom: 10px;">Reports</h2>

    <table class="wbb centered">
        <tr>
            <td>
                <a th:href="@{/studenttracker/report/student/tracker/name}" th:text="#{label.report.student.tracker}">
                    Student Tracker Report
                </a>
            </td>
        </tr>
    </table>

</div>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
