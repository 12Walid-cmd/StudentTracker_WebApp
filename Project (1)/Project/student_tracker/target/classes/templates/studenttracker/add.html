<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Student Study Record</title>
</head>
<body>
<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container has-text-centered">
    <h2 class="title is-2" th:if= "${record.id != 0}">Edit Study Record</h2>
    <h2 class="title is-2" th:if= "${record.id == 0}">Add New Study Record</h2>


    <form th:action="@{/studenttracker/submit}" method="post" th:object="${record}"
          class="wbb" style="display:inline-block;text-align:left!important">

        <input type="hidden" th:field="*{id}" th:value="*{id} ?: 0" />

        <p>



            <label>Student Name:</label>
            <input type="text" th:field="*{studentName}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('*{studentName}')}" th:errors="*{studentName}"></p>

        <p>
            <label>Study Date:</label>
            <input type="date" th:field="*{studyDate}" placeholder="YYYY-MM-DD" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('*{studyDate}')}" th:errors="*{studyDate}"></p>

        <p>
            <label>Subject:</label>
            <input type="text" th:field="*{subject}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('*{subject}')}" th:errors="*{subject}"></p>

        <p>
            <label>Duration (minutes):</label>
            <input type="number" th:field="*{studyDurationMinutes}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('*{studyDurationMinutes}')}" th:errors="*{studyDurationMinutes}"></p>

        <p>
            <label>Study Method:</label>
            <input type="text" th:field="*{studyMethod}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('*{studyMethod}')}" th:errors="*{studyMethod}"></p>

        <p>
            <label>Daily Goal (minutes):</label>
            <input type="number" th:field="*{dailyStudyGoal}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('*{dailyStudyGoal}')}" th:errors="*{dailyStudyGoal}"></p>

        <p>
            <label>Weekly Goal (minutes):</label>
            <input type="number" th:field="*{weeklyStudyGoal}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('*{weeklyStudyGoal}')}" th:errors="*{weeklyStudyGoal}"></p>

        <p>
            <label>Notes:</label>
            <input type="text" th:field="*{notes}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('*{notes}')}" th:errors="*{notes}"></p>


        <button style="display:block;margin-top:24px!important" class="centered">Submit Record</button>
    </form>

</div>
<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
